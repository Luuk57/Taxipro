<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxigps App - Rit Gegevens</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      background-color: #f4f7f6;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h2 {
      color: #333;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    input[type="text"], input[type="datetime-local"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      font-weight: bold;
    }
    button:hover {
      background-color: #219150;
    }
    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
    }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <h2>🚕 Taxigps - Rit Invoer</h2>

  <form id="taxiForm">
    <div class="form-group">
      <label for="afspraakTijd">Afspraak Datum & Tijd (Optioneel)</label>
      <input type="datetime-local" id="afspraakTijd">
    </div>

    <div class="form-group">
      <label for="haaladres">Haaladres (Auto GPS bij Start)</label>
      <input type="text" id="haaladres" placeholder="Laat leeg voor GPS of vul handmatig in">
    </div>

    <div class="form-group">
      <label for="startTijd">Start Datum & Tijd (Auto tijd bij Start)</label>
      <input type="datetime-local" id="startTijd">
    </div>

    <div class="form-group">
      <label for="brengAdres">Breng Adres (Optioneel)</label>
      <input type="text" id="brengAdres" placeholder="Bestemmingsadres">
    </div>

    <div class="form-group">
      <label for="stopTijd">Stop Datum & Tijd (Optioneel)</label>
      <input type="datetime-local" id="stopTijd">
    </div>

    <button type="submit" id="startBtn">Start Rit & Verstuur</button>
  </form>

  <div id="status"></div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzDTZg4LNy6Q6fv50p5MZqEnLHIeyKdzvjj8BrBODdXlGOwSBxQpdW444Y_p-ChIQminA/exec';

    document.getElementById('taxiForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const statusDiv = document.getElementById('status');
      statusDiv.className = '';
      statusDiv.innerText = 'GPS locatie en tijd ophalen...';

      // Automatische starttijd invullen indien leeg
      const nu = new Date();
      nu.setMinutes(nu.getMinutes() - nu.getTimezoneOffset());
      const huidigeTijdStr = nu.toISOString().slice(0, 16);
      
      let startTijdInput = document.getElementById('startTijd').value;
      if (!startTijdInput) {
        startTijdInput = huidigeTijdStr;
        document.getElementById('startTijd').value = huidigeTijdStr;
      }

      let bestaandHaaladres = document.getElementById('haaladres').value;

      // Als haaladres is ingevuld, direct versturen. Anders ophalen via GPS.
      if (bestaandHaaladres.trim() !== '') {
        verstuurNaarGoogleSheets(bestaandHaaladres, startTijdInput);
      } else {
        if (!navigator.geolocation) {
          verstuurNaarGoogleSheets('Geen GPS beschikbaar', startTijdInput);
          return;
        }

        navigator.geolocation.getCurrentPosition(function(position) {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          statusDiv.innerText = 'Adres opzoeken via GPS coördinaten...';

          fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`)
            .then(response => response.json())
            .then(data => {
              let straatadres = data.display_name || `Lat: ${lat}, Lon: ${lon}`;
              document.getElementById('haaladres').value = straatadres;
              verstuurNaarGoogleSheets(straatadres, startTijdInput);
            })
            .catch(() => {
              let coordAdres = `GPS: ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
              document.getElementById('haaladres').value = coordAdres;
              verstuurNaarGoogleSheets(coordAdres, startTijdInput);
            });

        }, function() {
          verstuurNaarGoogleSheets('GPS niet opgehaald', startTijdInput);
        }, { enableHighAccuracy: true });
      }
    });

    function verstuurNaarGoogleSheets(haaladres, startTijd) {
      const statusDiv = document.getElementById('status');
      
      const payload = {
        afspraakTijd: document.getElementById('afspraakTijd').value || '',
        haaladres: haaladres || '',
        startTijd: startTijd || '',
        brengAdres: document.getElementById('brengAdres').value || '',
        stopTijd: document.getElementById('stopTijd').value || ''
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.className = 'success';
        statusDiv.innerText = 'Rit succesvol opgeslagen!';
        document.getElementById('taxiForm').reset();
      })
      .catch(error => {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Fout bij verzenden naar Google Sheet: ' + error.message;
      });
    }
  </script>

</body>
</html>
