<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxigps App - GPS & Start</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      background-color: #f4f7f6;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h2 {
      color: #333;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    input[type="text"], input[type="datetime-local"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      font-weight: bold;
    }
    button:hover {
      background-color: #219150;
      background-color: #219150;
    }
    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
    }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <h2>🚕 Taxigps - Rit Starten met GPS</h2>

  <form id="taxiForm">
    <div class="form-group">
      <label for="chauffeur">Chauffeur</label>
      <input type="text" id="chauffeur" required placeholder="Naam chauffeur">
    </div>

    <div class="form-group">
      <label for="afspraakTijd">Afspraak Datum & Tijd</label>
      <input type="datetime-local" id="afspraakTijd" required>
    </div>

    <div class="form-group">
      <label for="haaladres">Haaladres (Wordt automatisch ingevuld bij Start)</label>
      <input type="text" id="haaladres" required placeholder="Klik op Start om GPS-adres op te halen">
    </div>

    <div class="form-group">
      <label for="startTijd">Start Datum & Tijd (Wordt automatisch ingevuld bij Start)</label>
      <input type="datetime-local" id="startTijd" required>
    </div>

    <button type="submit" id="startBtn">Start Rit & Verstuur</button>
  </form>

  <div id="status"></div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzDTZg4LNy6Q6fv50p5MZqEnLHIeyKdzvjj8BrBODdXlGOwSBxQpdW444Y_p-ChIQminA/exec';

    document.getElementById('taxiForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const statusDiv = document.getElementById('status');
      statusDiv.className = '';
      statusDiv.innerText = 'GPS locatie en tijd ophalen...';

      // 1. Vul de huidige datum en tijd in bij startTijd
      const nu = new Date();
      nu.setMinutes(nu.getMinutes() - nu.getTimezoneOffset());
      const huidigeTijdStr = nu.toISOString().slice(0, 16);
      document.getElementById('startTijd').value = huidigeTijdStr;

      // 2. Haal de GPS-locatie op
      if (!navigator.geolocation) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Geolokalisatie wordt niet ondersteund door jouw browser.';
        return;
      }

      navigator.geolocation.getCurrentPosition(function(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        statusDiv.innerText = 'Adres opzoeken via GPS coördinaten...';

        // Gebruik een openbare service (Nominatim) om coördinaten om te zetten naar een straatnaam/adres
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`)
          .then(response => response.json())
          .then(data => {
            let straatadres = data.display_name || `Lat: ${lat}, Lon: ${lon}`;
            document.getElementById('haaladres').value = straatadres;

            // 3. Verstuur alles naar Google Sheets
            verstuurNaarGoogleSheets(straatadres, huidigeTijdStr);
          })
          .catch(() => {
            // Als het opzoeken van het adres mislukt, vullen we ten minste de coördinaten in
            let coordAdres = `GPS: ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
            document.getElementById('haaladres').value = coordAdres;
            verstuurNaarGoogleSheets(coordAdres, huidigeTijdStr);
          });

      }, function(error) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Kon GPS-locatie niet ophalen: ' + error.message;
      }, { enableHighAccuracy: true });
    });

    function verstuurNaarGoogleSheets(haaladres, startTijd) {
      const statusDiv = document.getElementById('status');
      
      const payload = {
        chauffeur: document.getElementById('chauffeur').value,
        afspraakTijd: document.getElementById('afspraakTijd').value,
        haaladres: haaladres,
        startTijd: startTijd
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.className = 'success';
        statusDiv.innerText = 'Rit succesvol gestart, GPS-adres opgehaald en opgeslagen!';
        document.getElementById('taxiForm').reset();
      })
      .catch(error => {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Fout bij verzenden naar Google Sheet: ' + error.message;
      });
    }
  </script>

</body>
</html>
