<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxigps App - Handmatige Opslag</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      background-color: #f4f7f6;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h2 {
      color: #333;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    input[type="text"], input[type="datetime-local"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
    .btn-start { background-color: #2980b9; }
    .btn-start:hover { background-color: #2471a3; }
    
    .btn-save { background-color: #27ae60; }
    .btn-save:hover { background-color: #219150; }

    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
    }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
    .info { background-color: #e2f0d9; color: #385723; }
  </style>
</head>
<body>

  <h2>🚕 Taxigps - Rit Beheer</h2>

  <form id="taxiForm">
    <div class="form-group">
      <label for="afspraakTijd">Afspraak Datum & Tijd</label>
      <input type="datetime-local" id="afspraakTijd">
    </div>

    <div class="form-group">
      <label for="haaladres">Haaladres</label>
      <div style="display: flex; gap: 5px;">
        <input type="text" id="haaladres" placeholder="Haaladres (of klik Start)">
        <button type="button" class="btn-start" onclick="vulStartGegevens()" style="flex: 0 0 100px; padding: 8px; font-size: 14px;">GPS Start</button>
      </div>
    </div>

    <div class="form-group">
      <label for="startTijd">Start Datum & Tijd</label>
      <input type="datetime-local" id="startTijd">
    </div>

    <div class="form-group">
      <label for="brengAdres">Breng Adres</label>
      <input type="text" id="brengAdres" placeholder="Bestemmingsadres">
    </div>

    <div class="form-group">
      <label for="stopTijd">Stop Datum & Tijd</label>
      <input type="datetime-local" id="stopTijd">
    </div>

    <!-- Pas opslaan wanneer de chauffeur hier bewust op klikt -->
    <button type="button" class="btn-save" onclick="bewusteOpslaan()">Rit Opslaan naar Google Sheet</button>
  </form>

  <div id="status"></div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzDTZg4LNy6Q6fv50p5MZqEnLHIeyKdzvjj8BrBODdXlGOwSBxQpdW444Y_p-ChIQminA/exec';

    // 1. De knop om alleen de startgegevens (GPS en tijd) in te vullen op het scherm, ZONDER op te slaan
    function vulStartGegevens() {
      const statusDiv = document.getElementById('status');
      statusDiv.className = 'info';
      statusDiv.innerText = 'GPS locatie en starttijd ophalen...';

      // Vul starttijd in
      const nu = new Date();
      nu.setMinutes(nu.getMinutes() - nu.getTimezoneOffset());
      document.getElementById('startTijd').value = nu.toISOString().slice(0, 16);

      // Haal GPS op
      if (!navigator.geolocation) {
        statusDiv.innerText = 'Geen GPS ondersteuning. Vul handmatig in.';
        return;
      }

      navigator.geolocation.getCurrentPosition(function(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`)
          .then(response => response.json())
          .then(data => {
            let straatadres = data.display_name || `Lat: ${lat}, Lon: ${lon}`;
            document.getElementById('haaladres').value = straatadres;
            statusDiv.innerText = 'Startgegevens ingevuld (Nog niet opgeslagen!).';
          })
          .catch(() => {
            document.getElementById('haaladres').value = `GPS: ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
            statusDiv.innerText = 'Startgegevens ingevuld (Nog niet opgeslagen!).';
          });

      }, function() {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Kon GPS niet ophalen.';
      }, { enableHighAccuracy: true });
    }

    // 2. De definitieve opslaanknop die pas actie onderneemt als de chauffeur dat wil
    function bewusteOpslaan() {
      const statusDiv = document.getElementById('status');
      statusDiv.className = '';
      statusDiv.innerText = 'Bezig met opslaan naar Google Sheet...';

      const payload = {
        afspraakTijd: document.getElementById('afspraakTijd').value || '',
        haaladres: document.getElementById('haaladres').value || '',
        startTijd: document.getElementById('startTijd').value || '',
        brengAdres: document.getElementById('brengAdres').value || '',
        stopTijd: document.getElementById('stopTijd').value || ''
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.className = 'success';
        statusDiv.innerText = 'Rit succesvol opgeslagen op verzoek van chauffeur!';
        document.getElementById('taxiForm').reset();
      })
      .catch(error => {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Fout bij opslaan: ' + error.message;
      });
    }
  </script>

</body>
</html>
